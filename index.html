<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stringwise Tuner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="icon.svg" alt="Stringwise Tuner Logo" class="app-logo">
                <h1>Stringwise Tuner</h1>
            </div>
            <div class="tuning-selector">
                <label for="tuningPreset">Tuning:</label>
                <select id="tuningPreset">
                    <option value="standard">Standard (EADGBE)</option>
                    <option value="dropD">Drop D</option>
                    <option value="dadgad">DADGAD</option>
                    <option value="openG">Open G</option>
                    <option value="halfStepDown">Half Step Down</option>
                    <option value="openD">Open D</option>
                    <option value="cStandard">C Standard</option>
                </select>
            </div>
        </header>

        <main>
            <div class="tuner-display">
                <div class="gauge-container">
                    <div class="gauge-cents">
                        <span id="centsValue">-0</span> <span class="unit">cents</span>
                    </div>
                    <div class="gauge-indicator">
                        <div id="needle" class="needle"></div>
                        <div class="center-dot"></div>
                    </div>
                    <div class="gauge-labels">
                        <span>Zu tief</span>
                        <span>Perfekt</span>
                        <span>Zu hoch</span>
                    </div>
                </div>

                <div class="status-box" id="statusMessage">Mikrofon starten...</div>
                
                <div class="note-info">
                    <div id="currentNote" class="current-note">-</div>
                    <div id="targetFrequency" class="target-freq">0.00 Hz</div>
                </div>
            </div>

            <div class="strings-container" id="stringsContainer">
                <!-- Strings will be generated dynamically by JS -->
            </div>

            <div class="controls">
                <button id="micButton" class="btn primary-btn">Mikrofon starten</button>
                <div class="mode-toggle">
                    <label>
                        <input type="checkbox" id="autoModeToggle" checked>
                        <span class="toggle-text">Automatischer Saitenwechsel</span>
                    </label>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
