<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Hintergrund-Quadrat mit abgerundeten Ecken analog zum App-Icon im Foto -->
  <rect width="512" height="512" rx="140" fill="#1e252b"/>
  
  <!-- Drei horizontale hellgrüne Saiten / Linien -->
  <line x1="80" y1="206" x2="432" y2="206" stroke="#00e676" stroke-width="20" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#00e676" stroke-width="20" stroke-linecap="round"/>
  <line x1="80" y1="306" x2="432" y2="306" stroke="#00e676" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Zentrales Plus-Symbol mit kreisförmiger Umrandung -->
  <circle cx="256" cy="256" r="65" fill="#1e252b" stroke="#00e676" stroke-width="18"/>
  <line x1="216" y1="256" x2="296" y2="256" stroke="#00e676" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="216" x2="256" y2="296" stroke="#00e676" stroke-width="16" stroke-linecap="round"/>
</svg>
