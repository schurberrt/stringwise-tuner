<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="110" fill="#121214"/>
  <!-- Three structural lines symbolizing guitar strings in green matching requested UI theme -->
  <line x1="100" y1="180" x2="412" y2="180" stroke="#00E676" stroke-width="20" stroke-linecap="round"/>
  <line x1="100" y1="256" x2="412" y2="256" stroke="#00E676" stroke-width="20" stroke-linecap="round"/>
  <line x1="100" y1="332" x2="412" y2="332" stroke="#00E676" stroke-width="20" stroke-linecap="round"/>
  <!-- Tuning Node Emblem Center Box -->
  <circle cx="256" cy="256" r="80" fill="#121214" stroke="#00E676" stroke-width="20"/>
